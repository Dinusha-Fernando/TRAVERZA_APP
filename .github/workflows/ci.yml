name: TRAVERZA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  mobile-ci:
    name: Mobile Flutter Analyze, Test & Debug Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: |
          flutter test --coverage

      - name: Build Android Debug APK
        run: |
          flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traverza-mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  web-ci:
    name: Web Portal Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

      - name: Run Next.js Production Build
        run: |
          npm run build

  packages-ci:
    name: TypeScript API Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-client-ts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript
        run: |
          npm install --save-dev typescript

      - name: Compile TypeScript Client
        run: |
          npm run build
